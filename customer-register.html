
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Customer Account | ZIKAA</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .register-page {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 30px 18px;
      background:
        linear-gradient(rgba(5,25,30,.45), rgba(5,25,30,.68)),
        url("images/login-background.png") center / cover no-repeat;
    }

    .register-card {
      width: 100%;
      max-width: 440px;
      padding: 32px;
      border-radius: 24px;
      background: #fff8e9;
      box-shadow: 0 25px 70px rgba(0,0,0,.25);
    }

    .register-logo {
      display: block;
      text-align: center;
      font-size: 2rem;
      font-weight: 900;
      letter-spacing: 3px;
    }

    .register-logo span {
      color: #08aeb8;
    }

    .register-card h1,
    .register-intro {
      text-align: center;
    }

    .register-intro {
      color: #68797c;
      margin-bottom: 24px;
    }

    .register-form {
      display: grid;
      gap: 12px;
    }

    .register-form label {
      font-weight: 700;
    }

    .register-form input {
      width: 100%;
      padding: 13px;
      border: 1px solid #dcebed;
      border-radius: 10px;
    }

    .register-form button,
    .register-google {
      width: 100%;
      padding: 13px;
      border-radius: 10px;
      font-weight: 800;
      cursor: pointer;
    }

    .register-form button {
      margin-top: 8px;
      border: 0;
      background: #62e6e8;
    }

    .register-google {
      margin-top: 14px;
      border: 1px solid #dcebed;
      background: white;
    }

    #registerMessage {
      overflow-wrap: anywhere;
      font-size: .9rem;
    }

    .register-links {
      margin-top: 20px;
      text-align: center;
    }

    .register-links a {
      color: #087c83;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <main class="register-page">
    <section class="register-card">
      <a class="register-logo" href="index.html">ZIKAA<span>.</span></a>
      <h1>Create your account</h1>
      <p class="register-intro">Join ZIKAA and explore our creative world.</p>

      <form id="customerRegisterForm" class="register-form">
        <label for="registerName">Your name</label>
        <input id="registerName" type="text"
               autocomplete="name" maxlength="100" required>

        <label for="registerEmail">Email address</label>
        <input id="registerEmail" type="email"
               autocomplete="email" required>

        <label for="registerPassword">Create password</label>
        <input id="registerPassword" type="password"
               autocomplete="new-password" minlength="8" required>

        <button type="submit">Create Account</button>
      </form>

      <button id="registerGoogleBtn" class="register-google" type="button">
        Sign up with Google
      </button>

      <p id="registerMessage" role="status" aria-live="polite"></p>

      <div class="register-links">
        <p>Already registered? <a href="customer-login.html">Sign in</a></p>
        <p><a href="index.html">Back to homepage</a></p>
      </div>
    </section>
  </main>

  <script type="module" src="js/customer-register.js"></script>
</body>
</html>
